function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* NOTIFICATIONS */

async function loadNotifications() {
  try {
    const res = await fetch(DASHBOARD_FN, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${session.access_token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "get-dashboard"
      })
    });

    if (!res.ok) {
      throw new Error("Notification request failed");
    }

    const data = await res.json();

    if (data.success && data.notifications) {
      updateNotifications(data.notifications);
    }

  } catch (err) {
    console.error("Notification error:", err);
  }
}

function formatNotifTime(created_at) {
  const d = new Date(created_at);

  if (isNaN(d.getTime())) return "";

  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);

  if (diffMin < 1) return "Just now";
  if (diffMin < 60) return diffMin + "m ago";

  return d.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function updateNotifications(notifs) {
  const notifList = document.getElementById("notifList");
  const notifCount = document.getElementById("notifCount");

  if (!notifs || notifs.length === 0) {
    notifList.innerHTML = `
      <div class="notif-item" style="text-align:center;color:#86efac;">
        No new notifications
      </div>
    `;

    notifCount.style.display = "none";
    return;
  }

  const unreadCount = notifs.filter(n => !n.is_read).length;

  if (unreadCount > 0) {
    notifCount.textContent = unreadCount;
    notifCount.style.display = "flex";
  } else {
    notifCount.style.display = "none";
  }

  notifList.innerHTML = notifs.map(n => {
    const isUnread = !n.is_read;

    return `
      <div class="notif-item ${isUnread ? "unread" : "read"}">
        ${isUnread ? '<span class="notif-dot"></span>' : ""}
        <div class="notif-text">${escapeHtml(n.message)}</div>
        <span class="notif-time">
          ${formatNotifTime(n.created_at || Date.now())}
        </span>
      </div>
    `;
  }).join("");
}

async function markNotificationsRead() {

/* TRACKERS - DO NOT REMOVE
   Sends visit + active time to dashboard-service.
*/

function initTrackers() {
  trackVisit(userId);

  let lastActivityTime = Date.now();
  let accumulatedActiveSeconds = 0;

  const idleLimit = 3 * 60 * 1000;

  const activityEvents = [
    "click",
    "scroll",
    "keypress",
    "mousemove",
    "touchstart"
  ];

  activityEvents.forEach(event => {
    window.addEventListener(event, () => {
      lastActivityTime = Date.now();
    }, { passive: true });
  });

  setInterval(() => {
    if (document.hidden) return;

    const now = Date.now();
    const idleDuration = now - lastActivityTime;

    if (idleDuration < idleLimit) {
      accumulatedActiveSeconds += 10;
    }

    if (accumulatedActiveSeconds >= 60) {
      sendActiveTime(accumulatedActiveSeconds);
      accumulatedActiveSeconds = 0;
    }
  }, 10000);
}

async function trackVisit(userId) {
  try {
    const lastVisitKey = `last_visit_recorded_${userId}`;
    const lastVisitTime = localStorage.getItem(lastVisitKey);
    const now = Date.now();

    const thirtyMinutes = 30 * 60 * 1000;

    if (
      !lastVisitTime ||
      (now - Number(lastVisitTime)) > thirtyMinutes
    ) {
      localStorage.setItem(lastVisitKey, now.toString());

      await fetch(DASHBOARD_FN, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${session.access_token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "track-visit"
        })
      });
    }
  } catch (err) {
    console.error("Visit tracking error:", err);
  }
}

async function sendActiveTime(seconds) {
  if (
    typeof seconds !== "number" ||
    isNaN(seconds) ||
    seconds < 0 ||
    seconds > 70
  ) {
    return;
  }

  try {
    await fetch(DASHBOARD_FN, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${session.access_token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "track-time",
        active_seconds: seconds
      })
    });
  } catch (err) {
    console.error("Active time tracking error:", err);
  }
}

/* VERIFICATION STATUS REQUEST */

async function getVerificationStatus() {
  const {
    data: { session: currentSession }
  } = await supabase.auth.getSession();

  if (!currentSession) {
    window.location.href = "login.html";
    return null;
  }

  const res = await fetch(FN, {
    method: "POST",
    headers: {
      Authorization: `Bearer ${currentSession.access_token}`,
      "Content-Type": "application/json"
    }
  });

  if (!res.ok) {
    throw new Error("Unable to retrieve verification status");
  }

  const result = await res.json();

  if (result.success === false) {
    throw new Error(result.message || "Verification status request failed");
  }

  return result;
}

/* ATTEMPT DISPLAY */

function getAttemptsLeft(v) {
  if (typeof v.attemptsLeft === "number") {
    return Math.max(0, v.attemptsLeft);
  }

  const max = Number(v.max_attempts || 3);
  const used = Number(v.attempts || 0);

  return Math.max(0, max - used);
}

    </p>
  `;

  try {
    const {
      data: profile,
      error: profileError
    } = await supabase
      .from("users")
      .select("name,date_of_birth")
      .eq("id", userId)
      .single();

    if (profileError || !profile?.date_of_birth) {
      showDobRequired();
      return;
    }

    const v = await getVerificationStatus();

    if (!v) return;

    currentStatus = v.status;

    if (v.verified || v.status === "verified") {
      showVerified(v);
      return;
    }

    if (v.blocked) {
      showBlocked();
      return;
    }

    if (v.status === "pending") {
      showPending();
      return;
    }

    if (v.status === "expired") {
      showExpired(v);
      return;
    }

    if (v.status === "failed") {
      showFailed(v);
      return;
    }

    showStartVerification(v);

  } catch (err) {
    console.error("Verification status error:", err);

    container.innerHTML = `
      <div class="status-icon status-failed">
        <i class="fa-solid fa-wifi"></i>
      </div>

      <h2>Connection Error</h2>

      <p>
        We couldn't retrieve your verification status.
        Please check your internet connection and try again.
      </p>

      <button class="verify-main-btn" onclick="initVerifyPage()">
        <i class="fa-solid fa-rotate"></i>
        Try Again
      </button>
    `;
  }
}

window.initVerifyPage = initVerifyPage;

/* DOB REQUIRED */

function showDobRequired() {
  const container = document.getElementById("verifyContainer");

  container.innerHTML = `
    <div class="status-icon status-pending">
      <i class="fa-solid fa-calendar-days"></i>
    </div>

    <h2>Add Date of Birth First</h2>

    <p>
      Before verifying your identity, please add your correct
      date of birth to your Iyal Surveys profile.
    </p>

    <a href="profile.html" class="verify-main-btn" style="text-decoration:none;">
      <i class="fa-solid fa-user-pen"></i>
      Go to Profile
    </a>
  `;
}

/* VERIFIED */

function showVerified(v) {
  const container = document.getElementById("verifyContainer");

  const verifiedDate = v.verified_at
    ? new Date(v.verified_at).toLocaleString()
    : "";

  container.innerHTML = `
    <div class="status-icon status-success">
      <i class="fa-solid fa-shield-check"></i>
    </div>

    <h2>Identity Verified!</h2>

    <p>
      Congratulations! Your identity has been successfully verified.
      Your Iyal Surveys account is now verified.
    </p>

    ${verifiedDate ? `
      <div class="info-box" style="text-align:center;">
        <span style="color:#86efac;">Verified on</span><br>
        <strong>${escapeHtml(verifiedDate)}</strong>
      </div>
    ` : ""}

    <button class="verify-main-btn" onclick="window.location.href='${returnTo}'">
      <i class="fa-solid fa-arrow-right"></i>
      Continue
    </button>
  `;

  loadNotifications();
}

/* BLOCKED */

function showBlocked() {
  const container = document.getElementById("verifyContainer");

  container.innerHTML = `
    <div class="status-icon status-failed">
      <i class="fa-solid fa-lock"></i>
    </div>

    <h2>Verification Locked</h2>

    <p style="color:#fca5a5;">
      You have used all 3 verification attempts available for today.
    </p>

    <div class="warning-box">
      <strong>Why is verification locked?</strong><br><br>

      Your verification attempts have reached the daily limit.
      This restriction helps protect accounts against fraudulent
      verification attempts.

      <br><br>

      If you believe this is a mistake, contact our Support team
      for assistance.
    </div>

    <a href="support.html" class="verify-main-btn" style="text-decoration:none;">
      <i class="fa-solid fa-headset"></i>
      Contact Support
    </a>

    <a href="${returnTo}" class="verify-sec-btn">
      Go Back
    </a>
  `;
}

/* PENDING */

function showPending() {
  const container = document.getElementById("verifyContainer");

  container.innerHTML = `
    <div class="status-icon status-pending">
      <i class="fa-solid fa-hourglass-half"></i>
    </div>

    <div class="pending-indicator">
      <span></span>
      Verification in progress
    </div>

    <h2>We're Reviewing Your Identity</h2>

    <p>
      Your verification has been submitted successfully.
      We're waiting for the verification result.
    </p>

    <div class="info-box">
      <strong style="color:#86efac;">What happens next?</strong><br>
      Your identity verification is being processed.
      You don't need to submit another verification while
      this one is pending.
    </div>

    <button class="verify-main-btn" id="checkStatusBtn" onclick="manualCheckStatus()">
      <i class="fa-solid fa-rotate"></i>
      Check Verification Status
    </button>

    <a href="${returnTo}" class="verify-sec-btn">
      Go Back
    </a>
  `;

  startPolling();
}

/* EXPIRED */

function showExpired(v) {
  const container = document.getElementById("verifyContainer");
  const canRetry = v.can_retry === true;

  container.innerHTML = `
    <div class="status-icon status-failed">
      <i class="fa-solid fa-clock"></i>
    </div>

    <h2>Verification Expired</h2>

    <p>
      Your previous verification session expired before
      completion. You may need to start a new session.
    </p>

    ${attemptsBox(v)}

    ${
      canRetry
        ? `
          <button class="verify-main-btn" onclick="startVerify()">
            <i class="fa-solid fa-rotate"></i>
            Try Again
          </button>
        `
        : `
          <div class="warning-box">
            You cannot start another attempt right now.
            Please contact Support if you need assistance.
          </div>

          <a href="support.html" class="verify-main-btn" style="text-decoration:none;">
            Contact Support
          </a>
        `
    }

    <a href="${returnTo}" class="verify-sec-btn">
      Go Back
    </a>
  `;
}

/* FAILED */

function showFailed(v) {
  const container = document.getElementById("verifyContainer");
  const canRetry = v.can_retry === true;

  container.innerHTML = `
    <div class="status-icon status-failed">
      <i class="fa-solid fa-circle-xmark"></i>
    </div>

    <h2>Verification Unsuccessful</h2>

    <p>
      Unfortunately, your identity verification was not successful.
      Please carefully review your information before trying again.
    </p>

    <div class="info-box">
      <strong style="color:#86efac;">Before your next attempt:</strong><br>
      • Use a valid government-issued ID.<br>
      • Make sure your ID details are clearly visible.<br>
      • Take your selfie in good lighting.<br>
      • Ensure your profile information is correct.
    </div>

    ${attemptsBox(v)}

    ${
      canRetry
        ? `
          <button class="verify-main-btn" onclick="startVerify()">
            <i class="fa-solid fa-rotate"></i>
            Try Again
          </button>
        `
        : `
          <div class="warning-box">
            You have no more verification attempts available right now.
            Contact Support if you need help.
          </div>

          <a href="support.html" class="verify-main-btn" style="text-decoration:none;">
            Contact Support
          </a>
        `
    }

    <a href="${returnTo}" class="verify-sec-btn">
      Go Back
    </a>
  `;
}

/* DEFAULT START SCREEN */

function showStartVerification(v) {
  const container = document.getElementById("verifyContainer");
  const canRetry = v.can_retry === true;
  const attemptsLeft = getAttemptsLeft(v);

  container.innerHTML = `
    <div class="status-icon status-info">
      <i class="fa-solid fa-shield-halved"></i>
    </div>

    <h2>Verify Your Identity</h2>

    <p>
      Complete a quick identity verification to help protect
      your account and keep Iyal Surveys secure.
    </p>

    ${attemptsBox(v)}

    <div class="info-box">
      <strong style="color:#86efac;">How verification works</strong><br><br>

      <i class="fa-solid fa-id-card" style="color:#86efac;"></i>
      Take a clear photo of the front of your ID.<br>

      <i class="fa-solid fa-camera" style="color:#86efac;"></i>
      Take a quick selfie.<br>

      <i class="fa-solid fa-shield-halved" style="color:#86efac;"></i>
      Your identity details will be checked securely.
    </div>

    <div class="warning-box">
      <strong>Accepted identification:</strong><br>
      NIN Slip / NIN Card / Driver's License / Voter's Card.

      <br><br>

      Make sure the name and information on your ID
      match your account details.
    </div>

    ${
      canRetry && attemptsLeft > 0
        ? `
          <button class="verify-main-btn" onclick="startVerify()">
            <i class="fa-solid fa-shield-halved"></i>
            Start Verification
          </button>
        `
        : `
          <div class="warning-box">
            Verification is currently unavailable.
            Please contact Support for assistance.
          </div>

          <a href="support.html" class="verify-main-btn" style="text-decoration:none;">
            Contact Support
          </a>
        `
    }

    <a href="${returnTo}" class="verify-sec-btn">
      Go Back
    </a>
  `;
}

/* ATTEMPTS DISPLAY */

function attemptsBox(v) {
  const attemptsLeft = getAttemptsLeft(v);
  const maxAttempts = Number(v.max_attempts || 3);

  return `
    <div class="attempts-box">
      <span>
        <i class="fa-solid fa-rotate" style="color:#86efac;margin-right:7px;"></i>
        Attempts remaining today
      </span>

      <strong>${attemptsLeft} / ${maxAttempts}</strong>
    </div>
  `;
}

/* START VERIFICATION */

window.startVerify = async function() {
  if (isStartingVerification) return;

  isStartingVerification = true;

  /*
    Open Persona immediately during the click event.
    This helps avoid browser popup blockers.
  */

  const personaUrl =
    `https://withpersona.com/verify?inquiry-template-id=${encodeURIComponent(TEMPLATE_ID)}&reference-id=${encodeURIComponent(userId)}`;

  const personaWindow = window.open(personaUrl, "_blank");

  if (!personaWindow) {
    showToast("Please allow pop-ups to continue verification.");
    isStartingVerification = false;
    return;
  }

  const container = document.getElementById("verifyContainer");

  container.innerHTML = `
    <div class="status-icon status-pending">
      <i class="fa-solid fa-hourglass-half"></i>
    </div>

    <h2>Verification Started</h2>

    <p>
      Complete the verification process in the newly opened tab.
      We will automatically check your status.
    </p>

    <div class="loader-wrap">
      <div class="loader"></div>
    </div>

    <p style="font-size:.85rem;color:#86efac;">
      Please don't close this page.
    </p>
  `;

  isStartingVerification = false;

  /*
    We do not insert a verification row from the frontend.
    Persona webhook and existing backend logic remain responsible
    for recording verification events.
  */

  pollingAttempts = 0;
  startPolling();
};

/* POLLING */

function stopPolling() {
  if (pollingTimer) {
    clearInterval(pollingTimer);
    pollingTimer = null;
  }

  pollingAttempts = 0;
}

function startPolling() {
  if (pollingTimer) return;

  pollingAttempts = 0;

  pollingTimer = setInterval(async () => {
    pollingAttempts++;

    if (pollingAttempts > MAX_POLLING_ATTEMPTS) {
      stopPolling();

      showToast("Status checking paused. You can check again manually.");

      return;
    }

    await checkStatusInBackground();

  }, POLLING_INTERVAL);
}

async function checkStatusInBackground() {
  if (isCheckingStatus) return;

  isCheckingStatus = true;

  try {
    const v = await getVerificationStatus();

    if (!v) return;

    const newStatus = v.status;

    if (
      v.verified ||
      newStatus === "verified" ||
      newStatus === "failed" ||
      newStatus === "expired" ||
      v.blocked
    ) {
      stopPolling();

      currentStatus = newStatus;

      /*
        Give the database trigger a short moment to insert
        the notification before refreshing the notification list.
      */

      setTimeout(loadNotifications, 500);

      await initVerifyPage();
    }

  } catch (err) {
    console.error("Background status check error:", err);
  } finally {
    isCheckingStatus = false;
  }
}

/* MANUAL STATUS CHECK */

window.manualCheckStatus = async function() {
  const button = document.getElementById("checkStatusBtn");

  if (button) {
    button.disabled = true;
    button.innerHTML = `
      <i class="fa-solid fa-spinner fa-spin"></i>
      Checking...
    `;
  }

  try {
    const v = await getVerificationStatus();

    if (!v) return;

    if (
      v.verified ||
      v.status === "verified" ||
      v.status === "failed" ||
      v.status === "expired" ||
      v.blocked
    ) {
      stopPolling();

      setTimeout(loadNotifications, 500);

      await initVerifyPage();

      showToast("Verification status updated.");
      return;
    }

    showToast("Your verification is still being processed.");

  } catch (err) {
    console.error("Manual status check error:", err);
    showToast("Unable to check status. Try again.");
  } finally {
    const updatedButton = document.getElementById("checkStatusBtn");

    if (updatedButton) {
      updatedButton.disabled = false;
      updatedButton.innerHTML = `
        <i class="fa-solid fa-rotate"></i>
        Check Verification Status
      `;
    }
  }
};

/* LOGOUT */

document.getElementById("logoutBtn").addEventListener("click", async (e) => {
  e.preventDefault();

  stopPolling();

  await supabase.auth.signOut();

  window.location.href = "login.html";
});

/* CLEANUP */

window.addEventListener("beforeunload", () => {
  stopPolling();
});

</script>
