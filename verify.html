<script type="module">

/* =========================
   SECURITY: HTML ESCAPING
========================= */
function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* =========================
   POLITE TOAST SYSTEM
========================= */
function showToast(message) {
  let toast = document.getElementById('customToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'customToast';
    toast.className = 'toast-notification';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => {

  }, 3000);
}

/* =========================

========================= */

/* FETCH NOTIFICATIONS FOR BELL */
async function loadNotifications() {
  try {
    const res = await fetch(
      "https://xkshzlfducmnglxfnxzk.supabase.co/functions/v1/dashboard-service",
      {
        method: "POST",
        headers: {
          Authorization: `Bearer ${session.access_token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ action: "get-dashboard" })
      }
    );
    const data = await res.json();
    if (data.success && data.notifications) {
      updateNotifications(data.notifications);
    }
  } catch (err) {
    showToast("Unable to load notifications.");
  }
}

function formatNotifTime(created_at) {
  const d = new Date(created_at);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);
  const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (diffMin < 1) return 'Just now';
  if (diffMin < 60) return diffMin + 'm ago';
  return timeStr;
}

function updateNotifications(notifs){
  const notifList = document.getElementById("notifList");
  const notifCount = document.getElementById("notifCount");
  if(!notifs || notifs.length === 0){
    notifList.innerHTML = `<div class="notif-item" style="text-align:center; color:#86efac;">No new notifications</div>`;
    notifCount.style.display = "none";
    return;
  }
  let unreadCount = notifs.filter(n => !n.is_read).length;
  if(unreadCount > 0){ notifCount.textContent = unreadCount; notifCount.style.display = "flex"; }
  else { notifCount.style.display = "none"; }
  notifList.innerHTML = notifs.map(n => {
    const isUnread = !n.is_read;
    return `<div class="notif-item ${isUnread ? 'unread' : 'read'}">${isUnread ? '<span class="notif-dot"></span>' : ''}<div class="notif-text">${escapeHtml(n.message)}</div><span class="notif-time">${formatNotifTime(n.created_at || Date.now())}</span></div>`;
  }).join('');
}

async function markNotificationsRead(){
  document.getElementById("notifCount").style.display = "none";

  }

/* =========================================================
   VISIT & ACTIVE TIME TRACKER (Hardened & Anti-Cheat)
========================================================= */
function initTrackers() {
  trackVisit(userId);

  let lastActivityTime = Date.now();
  let accumulatedActiveSeconds = 0;
  const idleLimit = 3 * 60 * 1000;

  const activityEvents = ['click', 'scroll', 'keypress', 'mousemove', 'touchstart'];
  activityEvents.forEach(event => {
    window.addEventListener(event, () => {
      lastActivityTime = Date.now();
    }, { passive: true });
  });

  setInterval(() => {
    if (document.hidden) return;

    const now = Date.now();
    const idleDuration = now - lastActivityTime;

    if (idleDuration < idleLimit) {
      accumulatedActiveSeconds += 10;
    }

    if (accumulatedActiveSeconds >= 60) {
      sendActiveTime(accumulatedActiveSeconds);
      accumulatedActiveSeconds = 0;
    }
  }, 10000);
}

async function trackVisit(userId) {
  try {
    const lastVisitKey = `last_visit_recorded_${userId}`;
    const lastVisitTime = localStorage.getItem(lastVisitKey);
    const now = Date.now();
    const thirtyMinutes = 30 * 60 * 1000;

    if (!lastVisitTime || (now - Number(lastVisitTime)) > thirtyMinutes) {
      localStorage.setItem(lastVisitKey, now.toString());
      await fetch(
        "https://xkshzlfducmnglxfnxzk.supabase.co/functions/v1/dashboard-service",
        {
          method: "POST",
          headers: {
            Authorization: `Bearer ${session.access_token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ action: "track-visit" })
        }
      );
    }
  } catch (err) {
    // silent catch
  }
}

async function sendActiveTime(seconds) {
  if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0 || seconds > 70) {
    return;
  }

  try {
    await fetch("https://xkshzlfducmnglxfnxzk.supabase.co/functions/v1/dashboard-service", {
      method: "POST",
      headers: {
        Authorization: `Bearer ${session.access_token}`,
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        action: "track-time",
        active_seconds: seconds
      })
    });
  } catch (err) {
    // silent catch
  }
}

/* =========================
   VERIFICATION FLOW LOGIC
========================= */
async function initVerifyPage() {
  const container = document.getElementById("verifyContainer");

  // Step 1: Check users.date_of_birth
  const { data: profile, error: profileError } = await supabase
    .from("users")
    .select("name, date_of_birth")
    .eq("id", userId)
    .single();

  if (profileError || !profile?.date_of_birth) {
    container.innerHTML = `
      <div style="background:#fef3c7; color:#1a1000; padding:20px; border-radius:18px; text-align:center;">
        <h3 style="font-size:1.3rem; margin-bottom:10px;">⚠️ Add Date of Birth First</h3>
        <p style="margin-bottom:16px; font-size:0.95rem;">Add your DOB in profile before verification.</p>
        <a href="profile.html" style="display:inline-block; background:#16a34a; color:white; padding:12px 20px; border-radius:14px; text-decoration:none; font-weight:700;">Go to Profile → Add DOB</a>
      </div>
    `;
    return;
  }

  // Step 2: Call verification status endpoint
  try {
    const res = await fetch(FN, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${session.access_token}`,
        "Content-Type": "application/json"
      }
    });
    const v = await res.json();

    if (v.verified) {
      container.innerHTML = `
        <h2>✅ Verified</h2>
        <p>Your account has been successfully verified. You have full access to claim rewards, run surveys, and withdraw funds.</p>
        <p style="color:#86efac; font-size:0.85rem; margin-bottom:20px;">Verified at: ${v.verified_at ? new Date(v.verified_at).toLocaleString() : ""}</p>
        <button class="verify-main-btn" onclick="window.location.href='${returnTo}'">Return to Dashboard</button>
      `;
      return;
    }

    if (v.blocked) {
      container.innerHTML = `
        <h2>🚫 Blocked</h2>
        <p>You used all 3 attempts. ${escapeHtml(v.mismatch_reason || "")}</p>
        <a href="support.html" class="verify-sec-btn" style="text-align:center;">Contact Support</a>
      `;
      return;
    }

    if (v.is_name_mismatch) {
      container.innerHTML = `
        <h2>❌ Name / ID No Match</h2>
        <p style="text-align:left; background:#ffffff08; padding:14px; border-radius:14px; margin-bottom:16px; font-size:0.9rem; line-height:1.5;">
          ID Name: <b>${escapeHtml(v.persona_name || "N/A")}</b><br>
          Account Name: <b>${escapeHtml(v.account_name || "N/A")}</b>
        </p>
        <p style="color:#fca5a5; margin-bottom:12px; font-size:0.9rem;">${escapeHtml(v.mismatch_reason || "")}</p>
        <p style="margin-bottom:16px; color:#d1fae5; font-size:0.9rem;">Attempts left: ${v.attemptsLeft}/3</p>
        <button class="verify-main-btn" onclick="startVerify()">Try Again</button>
        <a href="${returnTo}" class="verify-sec-btn" style="text-align:center; margin-top:10px;">Go Back</a>
      `;
      return;
    }

    if (v.status === "expired") {
      container.innerHTML = `
        <h2>⏰ Expired</h2>
        <p>Verification session expired. Please start again.</p>
        <button class="verify-main-btn" onclick="startVerify()">Start Again</button>
        <a href="${returnTo}" class="verify-sec-btn" style="text-align:center; margin-top:10px;">Go Back</a>
      `;
      return;
    }

    if (v.mismatch_reason?.startsWith("DUPLICATE_ID")) {
      container.innerHTML = `
        <h2>❌ ID Already Used</h2>
        <p>This ID has already been used for another account.</p>
        <a href="support.html" class="verify-sec-btn" style="text-align:center; margin-top:20px;">Contact Support</a>
      `;
      return;
    }

    // Default / standard verification prompt
    container.innerHTML = `
      <h2>Verify Your Identity</h2>
      <p>Attempts left: ${v.attemptsLeft}/3</p>
      <p style="color:#bbf7d0; font-size:0.9rem; margin-bottom:24px;">${escapeHtml(v.mismatch_reason || "Use your government ID with name matching your account.")}</p>
      <button class="verify-main-btn" onclick="startVerify()">Start Verification</button>
      <a href="${returnTo}" class="verify-sec-btn" style="text-align:center; margin-top:10px;">Go Back</a>
    `;

  } catch (err) {
    console.error("Verification status fetch error:", err);
    container.innerHTML = `
      <h2>Connection Error</h2>
      <p>Unable to retrieve verification status. Please check your connection and try again.</p>
      <button class="verify-main-btn" onclick="window.location.reload()">Retry</button>
    `;
  }
}

window.startVerify = function() {
  window.open(`https://withpersona.com/verify?inquiry-template-id=${TEMPLATE_ID}&reference-id=${userId}`, "_blank");
  
  // Show submission waiting state on screen while polling
  const container = document.getElementById("verifyContainer");
  container.innerHTML = `
    <h2>Verification Submitted</h2>
    <p>Thank you. Please complete the flow in the opened tab. We are confirming your verification...</p>
    <div class="loader-wrap"><div class="loader"></div></div>
  `;

  let n = 0;
  const t = setInterval(async () => {
    n++;
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      clearInterval(t);
      return;
    }
    try {
      const r = await fetch(FN, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${session.access_token}`,
          "Content-Type": "application/json"
        }
      });
      const v = await r.json();
      if (v.verified || v.status === "expired" || v.status === "failed" || v.blocked || n > 12) {
        clearInterval(t);
        initVerifyPage();
      }
    } catch (e) {
      // ignore network errors during poll
    }
  }, 5000);
};
